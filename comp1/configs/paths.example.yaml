# comp1 machine-specific settings. Copy this file to paths.yaml and edit it.
# Relative paths are relative to the comp1/ folder. An environment variable AICUP_<KEY> overrides a value,
# e.g. AICUP_HUMANSL_WEIGHT=/data/HumanSL_state_only.pt

# KataGo Human SL weights converted to a plain PyTorch state dict (see README, "權重").
humansl_weight: runs/fisher_policy_pilot_20261105_v2/assets/HumanSL_state_only.pt

# Working folder of the GPU-host token extraction (tokfull_vm_20261116_v1.py); its stream outputs go to
# <vm_runs_dir>/tokfull_20261116/.
vm_runs_dir: runs

# Python interpreter used to launch the token-extraction worker processes. Empty = the interpreter running the script.
python_exe:

# tar that can stream .7z archives (libarchive / bsdtar). On Windows use C:\Windows\System32\tar.exe.
tar_exe: tar
